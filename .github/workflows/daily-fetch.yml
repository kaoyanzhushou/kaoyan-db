name: daily-frontier-fetch

# 每日定时抓取 Crossref 英文论文元数据，生成根目录 daily-frontier.json 并提交回仓库。
# 中文核心、会议、课题、特刊征稿不在此自动抓取，由人工核实后录入 rnc-updates.json。

on:
  schedule:
    # 每日 00:30 UTC（北京时间 08:30）；GitHub Actions 定时任务通常有数分钟到十几分钟延迟，属正常。
    - cron: "30 0 * * *"
  workflow_dispatch: {} # 允许在 Actions 页面手动触发一次

permissions:
  contents: write # 允许 GITHUB_TOKEN 提交本仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch daily frontier papers
        run: python scripts/fetch_daily.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-frontier.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(daily): refresh frontier papers [skip ci]"
            git push
          else
            echo "daily-frontier.json 无变化，跳过提交。"
          fi
