<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研资料库 - 全栈版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 加载屏幕 -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-icon">📚</div>
            <h1>考研资料库</h1>
            <p id="loadingText">正在加载...</p>
            <div class="loading-bar"><div class="loading-progress" id="loadingProgress"></div></div>
        </div>
    </div>

    <!-- 登录页面 -->
    <div id="loginPage" style="display:none">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">📚</div>
                <h1>考研资料库</h1>
                <p>英语一 · 政治 · 运动生理学 · 运动解剖学</p>
            </div>
            <div class="login-tabs">
                <button class="login-tab active" onclick="switchLoginTab('login')">登录</button>
                <button class="login-tab" onclick="switchLoginTab('register')">注册</button>
            </div>
            <div id="loginForm" class="login-form">
                <div class="form-group"><label>邮箱</label><input type="email" id="loginEmail" placeholder="请输入邮箱"></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
                <button class="btn-primary" onclick="handleLogin()">登录</button>
            </div>
            <div id="registerForm" class="login-form" style="display:none">
                <div class="form-group"><label>用户名</label><input type="text" id="registerUsername" placeholder="请输入用户名"></div>
                <div class="form-group"><label>邮箱</label><input type="email" id="registerEmail" placeholder="请输入邮箱"></div>
                <div class="form-group"><label>密码</label><input type="password" id="registerPassword" placeholder="至少6位"></div>
                <div class="form-group"><label>邀请码</label><input type="text" id="registerInviteCode" placeholder="请输入邀请码"></div>
                <button class="btn-primary" onclick="handleRegister()">注册</button>
                <p class="login-hint">需要邀请码才能注册</p>
            </div>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="mainApp" style="display:none">
        <header class="app-header">
            <div class="header-left">
                <div class="app-logo">📚</div>
                <h1 class="app-title">考研资料库</h1>
            </div>
            <div class="header-center">
                <input type="text" id="globalSearch" placeholder="🔍 搜索知识点、词汇、真题..." onkeyup="handleGlobalSearch(event)">
            </div>
            <div class="header-right">
                <div class="user-info" onclick="toggleUserMenu()">
                    <span id="userAvatar">👤</span>
                    <span id="userName">用户</span>
                </div>
                <div id="userMenu" class="user-menu" style="display:none">
                    <div class="user-menu-item" onclick="showProfile()">个人中心</div>
                    <div class="user-menu-item" id="adminMenuItem" style="display:none" onclick="showAdminPanel()">⚙️ 管理后台</div>
                    <div class="user-menu-item" onclick="handleLogout()">退出登录</div>
                </div>
            </div>
        </header>

        <div class="app-body">
            <nav class="app-sidebar">
                <div class="nav-section">
                    <div class="nav-section-title">学习中心</div>
                    <div class="nav-item active" onclick="switchTab('dashboard')"><span class="nav-icon">🏠</span><span>首页</span></div>
                    <div class="nav-item" onclick="switchTab('knowledge')"><span class="nav-icon">📖</span><span>知识库</span></div>
                    <div class="nav-item" onclick="switchTab('vocab')"><span class="nav-icon">📝</span><span>英语词汇</span></div>
                    <div class="nav-item" onclick="switchTab('reading')"><span class="nav-icon">📄</span><span>真题阅读</span></div>
                    <div class="nav-item" onclick="switchTab('flashcards')"><span class="nav-icon">🃏</span><span>闪卡记忆</span></div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">工具</div>
                    <div class="nav-item" onclick="switchTab('atlas')"><span class="nav-icon">🦴</span><span>解剖图谱</span></div>
                    <div class="nav-item" onclick="switchTab('physiology')"><span class="nav-icon">💪</span><span>生理图谱</span></div>
                    <div class="nav-item" onclick="switchTab('progress')"><span class="nav-icon">📊</span><span>学习进度</span></div>
                </div>
            </nav>
            <main class="app-content" id="appContent"></main>
        </div>
    </div>

    <!-- 管理员后台 -->
    <div id="adminModal" class="modal" style="display:none">
        <div class="modal-content admin-modal">
            <div class="modal-header">
                <h2>⚙️ 管理员后台</h2>
                <button class="modal-close" onclick="closeAdminPanel()">×</button>
            </div>
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchAdminTab('invite')">邀请码管理</button>
                <button class="admin-tab" onclick="switchAdminTab('users')">用户管理</button>
                <button class="admin-tab" onclick="switchAdminTab('stats')">数据统计</button>
            </div>
            <div id="adminContent" class="admin-content"></div>
        </div>
    </div>

    <div id="toast" class="toast" style="display:none"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
